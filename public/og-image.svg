<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <radialGradient id="ogBgGlow" cx="35%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#193327" />
      <stop offset="50%" stop-color="#0F1A16" />
      <stop offset="100%" stop-color="#070B0A" />
    </radialGradient>
    <linearGradient id="ogGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="35%" stop-color="#E9C168" />
      <stop offset="70%" stop-color="#D6A84F" />
      <stop offset="100%" stop-color="#8F6516" />
    </linearGradient>
    <linearGradient id="ogEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="50%" stop-color="#315C45" />
      <stop offset="100%" stop-color="#142B20" />
    </linearGradient>
    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#ogBgGlow)" />

  <!-- Outer Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="32" stroke="#23332D" stroke-width="2" fill="none" />
  <rect x="36" y="36" width="1128" height="558" rx="24" stroke="#D6A84F" stroke-opacity="0.2" stroke-width="1" fill="none" />

  <!-- Sacred Geometry Backdrop (Right Side) -->
  <g transform="translate(900, 315)" opacity="0.25">
    <circle r="220" stroke="#D6A84F" stroke-width="2" stroke-dasharray="8 8" />
    <circle r="170" stroke="#315C45" stroke-width="3" />
    <polygon points="0,-160 138,80 -138,80" stroke="#D6A84F" stroke-width="2" fill="none" />
    <polygon points="0,160 138,-80 -138,-80" stroke="#D6A84F" stroke-width="2" fill="none" />
    <circle r="60" fill="#13231D" stroke="#D6A84F" stroke-width="2" />
  </g>

  <!-- Brand Emblem (Left Top Side) -->
  <g transform="translate(100, 100)">
    <rect width="100" height="100" rx="26" fill="#13231D" stroke="#D6A84F" stroke-width="3" />
    <!-- Monogram Inside Icon -->
    <path d="M50 24 L72 74 H61 L55 60 H45 L39 74 H28 Z M50 40 L46 51 H54 Z" fill="url(#ogGold)" />
    <!-- Crown Tri-Points -->
    <path d="M38 32 L50 20 L62 32 L56 34 L50 28 L44 34 Z" fill="url(#ogGold)" />
    <circle cx="50" cy="18" r="2.5" fill="#FFF3C4" />
  </g>

  <!-- Main Headline & Copy (Left Center) -->
  <g transform="translate(100, 250)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="310" height="36" rx="18" fill="#13231D" stroke="#315C45" stroke-width="1.5" />
    <circle cx="20" cy="18" r="5" fill="#86EFAC" />
    <text x="35" y="23" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#D6A84F" letter-spacing="2">PSICOLOGÍA &amp; ARQUETIPOS</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="'Cormorant Garamond', Georgia, serif" font-size="64" font-weight="700" fill="#F2EFE6" letter-spacing="-1">
      Arquetipos Universales
    </text>
    
    <!-- Subtitle / Value Proposition -->
    <text x="0" y="145" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="400" fill="#E5D7B7" opacity="0.95">
      Mapa Simbólico &amp; Evaluación de Autoconocimiento
    </text>

    <text x="0" y="185" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="300" fill="#9DA79F" width="600">
      Descubre tus 18 energías arquetípicas, luz, sombra, integración y oráculo diario.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 230)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="190" height="42" rx="12" fill="#16221E" stroke="#2B4E3C" stroke-width="1.5" />
      <text x="18" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#F2EFE6">👑 Test Arquetípico</text>

      <!-- Tag 2 -->
      <rect x="205" y="0" width="180" height="42" rx="12" fill="#16221E" stroke="#2B4E3C" stroke-width="1.5" />
      <text x="223" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#F2EFE6">🔮 Oráculo Diario</text>

      <!-- Tag 3 -->
      <rect x="400" y="0" width="220" height="42" rx="12" fill="#16221E" stroke="#2B4E3C" stroke-width="1.5" />
      <text x="418" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#F2EFE6">⚔️ Simulador &amp; Alianzas</text>
    </g>
  </g>

  <!-- 18 Archetype Solar Ring Badge Bottom-Right -->
  <g transform="translate(1030, 520)">
    <circle r="44" fill="#13231D" stroke="#D6A84F" stroke-width="2" />
    <text text-anchor="middle" y="6" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="700" fill="#D6A84F">18</text>
    <text text-anchor="middle" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#86EFAC" letter-spacing="1">ENERGÍAS</text>
  </g>
</svg>
